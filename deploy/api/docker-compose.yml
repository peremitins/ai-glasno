name: ai-glasno-api

services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile.api
    env_file:
      - .env
    ports:
      - "127.0.0.1:3100:3000"
    restart: unless-stopped
    networks:
      - glasno-data
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

networks:
  glasno-data:
    external: true
    name: glasno-prod_default
