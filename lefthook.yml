colors: false
output:
  - summary
  - success
  - failure
  - execution_out

pre-commit:
  parallel: false
  jobs:
    - name: Форматирование staged-файлов
      glob:
        - "*.{css,html,json,js,jsx,md,mjs,cjs,scss,ts,tsx,yaml,yml}"
        - "**/*.{css,html,json,js,jsx,md,mjs,cjs,scss,ts,tsx,yaml,yml}"
      run: pnpm exec prettier --write --no-error-on-unmatched-pattern -- {staged_files}
      stage_fixed: true
    - name: Проверка ESLint staged-файлов
      glob:
        - "*.{js,jsx,mjs,cjs,ts,tsx}"
        - "**/*.{js,jsx,mjs,cjs,ts,tsx}"
      run: pnpm exec eslint -- {staged_files}

pre-push:
  jobs:
    - name: Проверка форматирования
      run: pnpm format:check
    - name: Проверка ESLint
      run: pnpm lint
    - name: Запуск тестов
      run: pnpm test:run
    - name: Сборка клиента
      run: pnpm build
    - name: Сборка API
      run: pnpm build:api
